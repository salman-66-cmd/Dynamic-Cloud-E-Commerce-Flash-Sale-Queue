version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cloudsale-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cloudsale-network

  redis:
    image: redis:7-alpine
    container_name: cloudsale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cloudsale-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudsale-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/flashsale_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_cloud_secure_jwt_secret_key_987654321
      - CLIENT_URL=http://localhost:3000
      - MIN_WORKERS=2
      - MAX_WORKERS=8
      - RESERVATION_TIMEOUT_SEC=120
    depends_on:
      - mongodb
      - redis
    networks:
      - cloudsale-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudsale-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudsale-network

volumes:
  mongo_data:
  redis_data:

networks:
  cloudsale-network:
    driver: bridge
